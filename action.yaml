name: "☕️ affogato"
author: "Ryuya Yanagi"
description: "Run only the tests affected by your TypeScript changes."
inputs:
  tsconfig:
    description: "Path to the tsconfig.json file"
    required: true
    default: "tsconfig.json"
  token:
    description: "GitHub token for API access."
    required: true
  test_patterns:
    description: "Comma-separated list of test file patterns (e.g., 'test,spec,stories'). Default is 'test,spec'."
    required: false
    default: "test,spec"
outputs:
  affected_tests:
    description: "List of affected test files"
branding:
  icon: code
  color: gray-dark
runs:
  using: "node20"
  main: "dist/index.js"
